<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGITTARIUS | Kişisel Portfolyo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="room" id="roomEnv">
        
        <!-- Tuşa basılınca ortadan dışarıya yayılan siyah bulut / odak efekti -->
        <div class="dark-cloud-effect"></div>

        <!-- Başlangıçtaki Gündüz Çalışma Masası ve Monitör Düzeni -->
        <div class="desk-setup" id="deskSetup">
            
            <div class="monitor-frame">
                <div class="screen" id="monitorScreen">
                    <button class="power-btn" id="powerBtn" onclick="turnOnSystem()">
                        <svg viewBox="0 0 24 24" style="fill: none; stroke: #ef4444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                            <!-- Üst kısmı hafif aralık olan çember yayı -->
                            <path d="M18.36,6.64A9,9 0 1,1 5.64,6.64" />
                            <!-- Yukarı doğru sarkan dikey çubuk -->
                            <line x1="12" y1="2" x2="12" y2="10" />
                        </svg>
                        <span>SİSTEMİ AÇ</span>
                    </button>
                </div>
            </div>

            <!-- Monitör Ayağı -->
            <div class="monitor-stand-neck"></div>
            <div class="monitor-stand-base"></div>

            <!-- Detaylı Klavye ve Mouse -->
            <div class="desk-accessories">
                <div class="keyboard">
                    <div class="key-line"></div>
                    <div class="key-line"></div>
                    <div class="key-line"></div>
                </div>
                <div class="mouse">
                    <div class="mouse-wheel"></div>
                </div>
            </div>

        </div>

        <!-- Monitörün dışına, tüm odaya / ekrana dağılacak kategori kartları -->
        <div class="categories" id="categoriesContainer">
            <div class="card">
                <h3>EĞİTİM & AKADEMİ</h3>
                <p>Yazılım Mühendisliği | Konya Teknik Üniversitesi</p>
            </div>
            <div class="card">
                <h3>HOBİLER</h3>
                <p>Fotoğrafçılık, Oyun Geliştirme (Unity), Gezi</p>
            </div>
            <div class="card">
                <h3>TEKNOLOJİLER</h3>
                <p>Java, C++, SQL, Git & GitHub, VS Code</p>
            </div>
            <div class="card">
                <h3>SOSYAL & İLETİŞİM</h3>
                <p>Instagram & GitHub profillerime hızlı geçiş.</p>
            </div>
        </div>

    </div>

    <script>
        function turnOnSystem() {
            const room = document.getElementById('roomEnv');
            const powerBtn = document.getElementById('powerBtn');
            
            powerBtn.style.opacity = '0';
            powerBtn.style.transform = 'scale(0.5)';
            
            setTimeout(() => {
                powerBtn.style.display = 'none';
                room.classList.add('active-system');
            }, 300);
        }
    </script>

</body>
</html>
